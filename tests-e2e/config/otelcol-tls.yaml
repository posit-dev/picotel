receivers:
  otlp:
    protocols:
      http:
        endpoint: "localhost:4318"
        tls:
          cert_file: "${TLS_CERT_FILE}"
          key_file: "${TLS_KEY_FILE}"

exporters:
  file:
    path: "${OUTPUT_FILE}"
    format: json
    flush_interval: 100ms

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file]
    logs:
      receivers: [otlp]
      exporters: [file]
