name: R Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'r/**'
      - '.github/workflows/r.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'r/**'
      - '.github/workflows/r.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['release', 'oldrel-1']

    steps:
      - uses: actions/checkout@v4

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install test dependencies
        # use-public-rspm provides Linux binaries, so no source compilation.
        # install.packages() only warns on failure; verify and fail hard.
        run: |
          Rscript -e '
            pkgs <- c("testthat", "withr", "webfakes", "curl")
            install.packages(pkgs)
            missing <- setdiff(pkgs, rownames(installed.packages()))
            if (length(missing)) stop("failed to install: ", paste(missing, collapse = ", "))
          '

      - name: Run tests
        run: Rscript r/tests/run.R
